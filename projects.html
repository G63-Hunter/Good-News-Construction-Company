    <style>
        .grid .project-card:nth-child(n+10) {
            display: none;
        }

        .grid.show-all .project-card:nth-child(n+10) {
            display: block;
            animation: fadeInUp 0.6s ease forwards;
        }
    </style>

    <script>
        document.getElementById('view-more-btn').addEventListener('click', function() {
            const grid = document.querySelector('.grid');
            grid.classList.add('show-all');
            this.parentElement.style.display = 'none';
        });
    </script>

    <div id="chatbot-container">
        <div class="chat-header"><i class="fas fa-robot"></i>

        </div>

        </div>
        <div class="chat-footer"><input type="text" class="chat-input" id="chat-input"
